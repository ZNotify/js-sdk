name: Unit tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      require-current-artifact:
        description: Require the server artifact from the current workflow run
        required: false
        type: boolean
        default: false
jobs:
  test:
    strategy:
      matrix:
        node-version: [ 18.x, 19.x ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'ZNotify/js-sdk'

      - uses: ZNotify/test-server-action@master
        with:
          require-current-artifact: ${{ inputs.require-current-artifact || false }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn test
      - run: yarn coverage

      - run: yarn build

